syntax = "proto3";

option csharp_namespace = "Tgs.Promotion.DepositAccumulateRoulette.Common.Protos";

import "phoenix/protobuf/guid.proto";

message BidRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message BidResponse {
	string subject = 1;
}

message RouletteExchangeRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteExchangeResponse {
	RouletteResult result = 1;
	int32 remaining_count = 2;
}

message RouletteResult {
	phoenix.protobuf.GuidValue id = 1;
	int32 item_index = 2;
}
