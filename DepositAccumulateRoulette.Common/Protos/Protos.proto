syntax = "proto3";

option csharp_namespace = "Tgs.Promotion.DepositAccumulateRoulette.Common.Protos";

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/date.proto";
import "google/protobuf/timestamp.proto";

message ClearEventCacheRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteTaskRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteTaskResponse {
	phoenix.protobuf.GuidValue id = 1;
	int32 item_index = 2;
}

message RouletteCountItemsQueryRequest {
	string player_code = 1;
}

message RouletteCountItemsQueryResponse {
	repeated RouletteCountItemInfo items = 1;
}

message RouletteCountItemInfo {
	phoenix.protobuf.GuidValue promotion_id = 1;
	int32 roulette_count = 2;
}

message BidRequest {
	string player_code = 1;
	phoenix.protobuf.GuidValue promotion_id = 2;
}

message BidResponse {
	string subject = 1;
}

message RouletteRecordsQueryRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteRecordsQueryResponse {
	repeated RouletteRecordInfo roulette_records = 1;
}

message RouletteRecordInfo {
	phoenix.protobuf.GuidValue id = 1;
	phoenix.protobuf.DateValue date = 2;
	int32 item_index = 3;
	google.protobuf.Timestamp created_on = 4;
}