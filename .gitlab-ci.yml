include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/promotion-deposit-accumulate-roulette
  WorkerImageName: pgtgs/promotion-deposit-accumulate-roulette-worker
  BackgroundImageName: pgtgs/promotion-deposit-accumulate-roulette-background
  TgsServiceSettingKey: deposit-accumulate-roulette
  TgsWorkerSettingKey: deposit-accumulate-roulette-worker
  TgsBackgroundSettingKey: deposit-accumulate-roulette-background
  HelmTemplateServiceFolderName: deposit-accumulate-roulette
  HelmTemplateWorkerFolderName: deposit-accumulate-roulette-worker
  HelmTemplateBackgroundFolderName: deposit-accumulate-roulette-background
  BuildCacheKey: Tgs.DepositAccumulateRoulette.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "DepositAccumulateRoulette.Client"
  artifacts:
    paths:
      - DepositAccumulateRoulette.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "DepositAccumulateRouletteService/DepositAccumulateRouletteService.csproj" $ServiceImageName $Tag
    - push_docker "DepositAccumulateRoulette.Worker/DepositAccumulateRoulette.Worker.csproj" $WorkerImageName $Tag
    - push_docker "DepositAccumulateRoulette.Background/DepositAccumulateRoulette.Background.csproj" $BackgroundImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag
    - push_k8s_template $HelmTemplateBackgroundFolderName $BackgroundImageName $Tag

deploy-service-dev:
  extends: .deploy_template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  stage: deploy-dev
  environment:
    name: service-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-dev:
  extends: .deploy_template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  stage: deploy-dev
  environment:
    name: worker-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-background-dev:
  extends: .deploy_template
  stage: deploy-dev
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: background-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsBackgroundSettingKey $HelmTemplateBackgroundFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 23 * * *"
          }
        }
      EOF

deploy-service-staging:
  extends: .deploy_template
  stage: deploy-staging
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: service-staging
  needs:
    - deploy-service-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-staging:
  extends: .deploy_template
  stage: deploy-staging
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: worker-staging
  needs:
    - deploy-worker-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-background-staging:
  stage: deploy-staging
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: background-staging
  needs:
    - deploy-background-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsBackgroundSettingKey $HelmTemplateBackgroundFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 23 * * *"
          }
        }
      EOF

deploy-service-prod:
  extends: .deploy_template
  stage: deploy-prod
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: service-prod
  needs:
    - deploy-service-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-prod:
  extends: .deploy_template
  stage: deploy-prod
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: worker-prod
  needs:
    - deploy-worker-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-background-prod:
  extends: .deploy_template
  stage: deploy-prod
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: background-prod
  needs:
    - deploy-background-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsBackgroundSettingKey $HelmTemplateBackgroundFolderName $namespace
        {
          "cronjob": {
            "schedule": "0 23 * * *"
          }
        }
      EOF
