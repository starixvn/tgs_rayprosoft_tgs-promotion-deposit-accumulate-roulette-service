apiVersion: v1
kind: ConfigMap
metadata: 
  name: configmap-{{ include "deposit-accumulate-roulette.fullname" . }}
data:
  appsettings.json: |
    {
      "DepositAccumulateRoulette": {
        "PromotionBaseUrl": "http://promotion-api",
        "PlayerBaseUrl": "http://player-api",
        "DepositAccumulateRouletteWorkerBaseUrl": "http://tgs-deposit-accumulate-roulette-worker"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
    
    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "{{ .Release.Name }}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]     
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]