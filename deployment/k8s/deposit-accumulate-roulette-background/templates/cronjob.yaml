apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "deposit-accumulate-roulette-background.fullname" . }}-scheduler
spec:
  schedule: {{ .Values.cronjob.schedule }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          containers:
          - name: deposit-accumulate-roulette-background-job
            image: alpine/curl:3.14
            imagePullPolicy: IfNotPresent
            command:
              - curl
              - -X
              - POST
              - http://tgs-deposit-accumulate-roulette-background/scheduler/distribute/roulette/count
          restartPolicy: OnFailure