apiVersion: v1
kind: ConfigMap
metadata: 
  name: configmap-{{ include "deposit-accumulate-roulette-background.fullname" . }}
data:
  appsettings.json: | 
    {
      "DepositAccumulateRouletteBackground": {
        "PromotionBaseUrl": "http://promotion-api"
      }
    }
  monitor.settings.json: | 
    {
      "Logging":{
        "Console": {
          "FormatterName": "json",
          "FormatterOptions": {
            "IncludeScopes": "True",
            "TimestampFormat": "HH:mm:ss "
          }
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
