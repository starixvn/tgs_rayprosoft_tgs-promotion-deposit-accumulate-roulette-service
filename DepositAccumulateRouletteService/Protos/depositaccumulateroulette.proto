syntax = "proto3";

option csharp_namespace = "Tgs.Promotion.DepositAccumulateRouletteService.Protos";

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/date.proto";
import "google/protobuf/timestamp.proto";


message RouletteRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteResponse {
	phoenix.protobuf.GuidValue id = 1;
	int32 item_index = 2;
}

message RouletteRecordsRequest {
	phoenix.protobuf.GuidValue promotion_id = 1;
	string player_code = 2;
}

message RouletteRecordsResponse {
	repeated RouletteRecord roulette_records = 1;
}

message RouletteRecord {
	phoenix.protobuf.GuidValue id = 1;
	phoenix.protobuf.DateValue date = 2;
	int32 item_index = 3;
	google.protobuf.Timestamp created_on = 4;
}